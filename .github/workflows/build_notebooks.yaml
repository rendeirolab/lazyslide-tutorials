name: Execute notebooks
on:
  pull_request:
    paths:
      - ".github/workflows/build_notebooks.yaml"
      - "scripts/setup_env.py"
      - "tutorials/**"
      # Heavy notebooks render on HF Jobs (render_heavy.yaml).
      - "!tutorials/heavy/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_notebooks.yaml"
      - "scripts/setup_env.py"
      - "tutorials/**"
      # Heavy notebooks render on HF Jobs (render_heavy.yaml).
      - "!tutorials/heavy/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  runnbs:
    runs-on: linux-cpu16-600g
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: 1
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    permissions:
      contents: write # Allow GH actions to push changes to repo
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          filter: blob:none
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Third-party deps come from uv.lock. Bump them on purpose with
      # `uv lock --upgrade` in a PR. The in-house packages track main.
      - name: Install project
        run: uv sync --dev --upgrade-package lazyslide --upgrade-package wsidata --upgrade-package lazyslide-models
      # No cache for these downloads: they take about 2.5 min, while a cache of
      # them (26 GB or more) exceeds GitHub's 10 GB limit and never restores.
      - name: Setup data
        run: uv run scripts/setup_env.py

      - name: Compute notebook source hash
        id: notebook-source
        shell: bash
        run: |
          hash="$({
            find tutorials -maxdepth 1 -name '*.ipynb' -print0 \
              | sort -z \
              | xargs -0 -r jq -c \
                  '{kernelspec: .metadata.kernelspec, cells: [.cells[] | {cell_type, metadata, source}]}'
          } | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache notebooks
        uses: actions/cache@v5
        with:
          path: .jupyter_cache
          key: ${{ runner.os }}-jcache-v1-${{ hashFiles('uv.lock') }}-${{ steps.notebook-source.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-jcache-v1-${{ hashFiles('uv.lock') }}-
            ${{ runner.os }}-jcache-v1-

      - name: execute notebooks
        env:
          # Keep library warnings and download bars out of the rendered pages.
          # Kernels and dask workers inherit both.
          PYTHONWARNINGS: ignore
          HF_HUB_DISABLE_PROGRESS_BARS: 1
        run: |
          mkdir -p .jupyter_cache

          # Re-register all notebooks; cache will reuse existing executions when hash matches
          uv run jcache notebook add tutorials/*.ipynb
          uv run jcache project execute --executor local-parallel --timeout 1800
          # Kernels that start in the same second can race for a port ("Address
          # already in use") and die before running a cell. A second pass runs
          # only the notebooks the first pass did not cache.
          uv run jcache project execute --executor local-parallel --timeout 1800

      - name: output logs
        run: |
          uv run jcache notebook list
          for f in tutorials/*.ipynb ; do
            uv run jcache notebook info --tb $f
          done

      # write changed outputs back to the ipynb files
      # will fail if there was an execution error
      - name: merge notebooks
        run: |
          for f in tutorials/*.ipynb ; do
            uv run jcache notebook merge $f $f
          done

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Render notebooks
