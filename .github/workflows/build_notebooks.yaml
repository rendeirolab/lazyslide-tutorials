name: Execute notebooks
on:
  pull_request:
    paths:
      - ".github/workflows/build_notebooks.yaml"
      - "scripts/setup_env.py"
      - "tutorials/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_notebooks.yaml"
      - "scripts/setup_env.py"
      - "tutorials/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  runnbs:
    runs-on: linux-cpu16-600g
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: 1
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    permissions:
      contents: write # Allow GH actions to push changes to repo
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          filter: blob:none
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install project
        run: uv sync --dev --upgrade
      - name: Restore model and dataset cache
        id: artifact-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-hf-v1-${{ hashFiles('scripts/setup_env.py', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-v1-

      - name: Setup data
        run: uv run scripts/setup_env.py

      # Save before notebook execution so extracted or modified tutorial data
      # cannot contaminate the reusable download cache.
      - name: Save model and dataset cache
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/huggingface
          key: ${{ steps.artifact-cache.outputs.cache-primary-key }}

      - name: Verify model and dataset cache offline
        env:
          HF_HUB_OFFLINE: 1
          HF_DATASETS_OFFLINE: 1
          TRANSFORMERS_OFFLINE: 1
        run: uv run scripts/setup_env.py

      - name: Compute notebook source hash
        id: notebook-source
        shell: bash
        run: |
          hash="$({
            find tutorials -maxdepth 1 -name '*.ipynb' -print0 \
              | sort -z \
              | xargs -0 -r jq -c \
                  '{kernelspec: .metadata.kernelspec, cells: [.cells[] | {cell_type, metadata, source}]}'
          } | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache notebooks
        uses: actions/cache@v5
        with:
          path: .jupyter_cache
          key: ${{ runner.os }}-jcache-v1-${{ hashFiles('uv.lock') }}-${{ steps.notebook-source.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-jcache-v1-${{ hashFiles('uv.lock') }}-
            ${{ runner.os }}-jcache-v1-

      - name: execute notebooks
        run: |
          mkdir -p .jupyter_cache

          # Re-register all notebooks; cache will reuse existing executions when hash matches
          uv run jcache notebook add tutorials/*.ipynb
          uv run jcache project execute --executor local-parallel --timeout 1800

      - name: output logs
        run: |
          uv run jcache notebook list
          for f in tutorials/*.ipynb ; do
            uv run jcache notebook info --tb $f
          done

      # write changed outputs back to the ipynb files
      # will fail if there was an execution error
      - name: merge notebooks
        run: |
          for f in tutorials/*.ipynb ; do
            uv run jcache notebook merge $f $f
          done

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Render notebooks
